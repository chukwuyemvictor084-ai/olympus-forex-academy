
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Admin Login | Olympus Forex Trading Academy</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #080808; color: #f5f0e5; font-family: Arial, sans-serif; }
    .panel { width: 100%; max-width: 420px; padding: 36px; background: #111; border: 1px solid #8c7134; border-radius: 16px; box-shadow: 0 20px 70px #000; }
    .brand { text-align: center; margin-bottom: 30px; }
    .brand img { width: 84px; height: 84px; object-fit: contain; }
    .brand h1 { color: #d9b45b; font-size: 21px; margin: 14px 0 6px; }
    .brand p, .note { color: #aaa; font-size: 13px; line-height: 1.6; }
    label { display: block; margin: 18px 0 8px; font-size: 13px; }
    input { width: 100%; padding: 13px; border-radius: 8px; border: 1px solid #393939; background: #080808; color: white; font-size: 15px; }
    input:focus { outline: 1px solid #d9b45b; }
    button { width: 100%; padding: 14px; margin-top: 24px; border: 0; border-radius: 8px; background: #d9b45b; color: #111; font-weight: bold; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { min-height: 22px; color: #e6c777; font-size: 13px; line-height: 1.5; }
    .note { text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">
      <img src="logo.jpg" alt="Olympus Academy logo">
      <h1>OLYMPUS ADMIN</h1>
      <p>Forex Trading Academy · Management Portal</p>
    </div>
    <form id="loginForm">
      <label for="email">Admin email</label>
      <input id="email" type="email" autocomplete="username" placeholder="Enter your admin email" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
      <button id="loginButton" type="submit">Sign In Securely</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <p class="note">Authorised administrators only. Keep your login details private.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Signing in…";
      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;
        const { data: admin, error: adminError } = await client
          .from("admin_users").select("user_id").eq("user_id", data.user.id).maybeSingle();
        if (adminError || !admin) {
          await client.auth.signOut();
          throw new Error("This account is not authorised as an administrator.");
        }
        message.textContent = "Login successful. Your admin access is verified.";
        // The management dashboard will be added in the next step.
      } catch (error) {
        message.textContent = error.message || "Unable to sign in. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Sign In Securely";
      }
    });
  </script>
</body>
</html>
